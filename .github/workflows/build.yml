name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Xmx512m

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Cache Atlassian Plugin SDK
        id: cache-sdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: opt/atlassian-plugin-sdk
          key: atlassian-plugin-sdk-${{ runner.os }}-v1

      - name: Install Atlassian Plugin SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: ./setup-atlassian-sdk.sh "$GITHUB_WORKSPACE"

      - name: Add SDK to PATH
        run: echo "$GITHUB_WORKSPACE/opt/atlassian-plugin-sdk/bin" >> "$GITHUB_PATH"

      - name: Package plugin
        run: atlas-package

      - name: Upload plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prom-bamboo-exporter
          path: target/*.jar
          if-no-files-found: error
